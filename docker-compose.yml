version: '3.8'

services:
  # ==========================================
  # Banco de Dados Relacional: PostgreSQL
  # ==========================================
  postgres_db:
    image: postgres:16-alpine
    container_name: ecobalance_postgres
    restart: always
    environment:
      POSTGRES_DB: ecobalance_db
      POSTGRES_USER: ecouser
      POSTGRES_PASSWORD: ecopassword2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecouser -d ecobalance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecobalance_net

  # ==========================================
  # Camada Backend: API RESTful & SHA-256
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecobalance_backend
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      DATABASE_USER: ecouser
      DATABASE_PASSWORD: ecopassword2026
      DATABASE_NAME: ecobalance_db
    ports:
      - "3000:3000"
    networks:
      - ecobalance_net

  # ==========================================
  # Camada Frontend: Aplicação Web
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecobalance_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - ecobalance_net

# ==========================================
# Volumes e Redes
# ==========================================
volumes:
  pgdata:
    driver: local

networks:
  ecobalance_net:
    driver: bridge